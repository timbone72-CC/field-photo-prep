name: Stage capture order export

on:
  push:
    branches:
      - feat/capture-order-photo-organizer-20260916
    paths:
      - .github/workflows/stage-capture-order-export.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Apply narrow capture-order UI patch
        run: python3 scripts/stage_capture_order_export.py

      - name: Focused unit test
        run: gradle testDebugUnitTest --tests com.inandout.fieldphotoprep.CaptureOrderManifestTest

      - name: Build internal APK
        run: gradle assembleDebug

      - name: Commit tested implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/build.gradle app/src/main/java/com/inandout/fieldphotoprep/PhotoCaptureActivity.java
          git commit -m "Add capture order clipboard export"
          git push
