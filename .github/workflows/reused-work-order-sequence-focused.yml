name: Reused Work Order Sequence Focused Gate

on:
  push:
    branches:
      - fix/reused-work-order-capture-sequence-reset-20260917

jobs:
  focused-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Capture-order reuse reset focused tests
        run: gradle :app:testDebugUnitTest --tests com.inandout.fieldphotoprep.AutomaticCaptureOrderFilenameTest
