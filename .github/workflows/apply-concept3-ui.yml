name: Apply Concept 3 UI

on:
  push:
    branches:
      - feat/concept-3-ui-makeover-20260912

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply governed UI transformation
        run: python3 ci/apply_concept3_ui.py
      - name: Commit generated runtime changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app docs
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Implement Concept 3 non-camera UI"
          git push origin HEAD:feat/concept-3-ui-makeover-20260912
