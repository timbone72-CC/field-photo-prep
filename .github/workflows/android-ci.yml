name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Unit tests
        run: gradle test
      - name: Debug build
        run: gradle assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.inandout.fieldphotoprep
            adb shell am start -W -n com.inandout.fieldphotoprep/.MainActivity
            sleep 3
            adb shell pidof com.inandout.fieldphotoprep | grep -q '[0-9]'
            echo "Field Photo Prep launch smoke test passed"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: field-photo-prep-phase-1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
