name: Android CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/**

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Unit tests
        run: gradle test
      - name: Debug build
        run: gradle assembleDebug
