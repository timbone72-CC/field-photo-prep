name: Production Release Candidate

on:
  workflow_dispatch:
    inputs:
      previous_production_version_code:
        description: 'Highest production versionCode already installed or distributed (use 37 for current original FPP production baseline)'
        required: true
        default: '37'

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Validate required production signing secrets
        shell: bash
        env:
          FPP_RELEASE_KEYSTORE_B64: ${{ secrets.FPP_RELEASE_KEYSTORE_B64 }}
          FPP_RELEASE_STORE_PASSWORD: ${{ secrets.FPP_RELEASE_STORE_PASSWORD }}
          FPP_RELEASE_KEY_ALIAS: ${{ secrets.FPP_RELEASE_KEY_ALIAS }}
          FPP_RELEASE_KEY_PASSWORD: ${{ secrets.FPP_RELEASE_KEY_PASSWORD }}
          FPP_RELEASE_CERT_SHA256: ${{ secrets.FPP_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in             FPP_RELEASE_KEYSTORE_B64             FPP_RELEASE_STORE_PASSWORD             FPP_RELEASE_KEY_ALIAS             FPP_RELEASE_KEY_PASSWORD             FPP_RELEASE_CERT_SHA256
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Materialize production keystore in runner temp
        shell: bash
        env:
          FPP_RELEASE_KEYSTORE_B64: ${{ secrets.FPP_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          KEYSTORE="${RUNNER_TEMP}/field-photo-prep-production.jks"
          printf '%s' "${FPP_RELEASE_KEYSTORE_B64}" | base64 --decode > "${KEYSTORE}"
          chmod 600 "${KEYSTORE}"
          echo "FPP_RELEASE_STORE_FILE=${KEYSTORE}" >> "${GITHUB_ENV}"

      - name: Build signed production APK
        env:
          FPP_RELEASE_STORE_PASSWORD: ${{ secrets.FPP_RELEASE_STORE_PASSWORD }}
          FPP_RELEASE_KEY_ALIAS: ${{ secrets.FPP_RELEASE_KEY_ALIAS }}
          FPP_RELEASE_KEY_PASSWORD: ${{ secrets.FPP_RELEASE_KEY_PASSWORD }}
          FPP_RELEASE_CERT_SHA256: ${{ secrets.FPP_RELEASE_CERT_SHA256 }}
        run: gradle :app:verifyProductionReleaseIdentity :app:assembleRelease

      - name: Verify production package, callback, client config, signer, and hash
        env:
          FPP_EXPECTED_PACKAGE: com.inandout.fieldphotoprep
          FPP_EXPECTED_VERSION_CODE: '42'
          FPP_EXPECTED_VERSION_NAME: 0.28.5
          FPP_EXPECTED_AUTH_REDIRECT_SCHEME: com.inandout.fieldphotoprep
          FPP_EXPECTED_AUTH_REDIRECT_HOST: auth-callback
          FPP_EXPECTED_SUPABASE_URL: https://vtyiktvqhbgabawotkrj.supabase.co
          FPP_EXPECTED_SUPABASE_PUBLISHABLE_KEY: sb_publishable_QXGedlj5wCmMpV2HncZp9A_kfgLzuAQ
          FPP_EXPECTED_CERT_SHA256: ${{ secrets.FPP_RELEASE_CERT_SHA256 }}
          FPP_MIN_PREVIOUS_VERSION_CODE: ${{ inputs.previous_production_version_code }}
          FPP_FORBIDDEN_STRING: com.inandout.fieldphotoprep.internal
          FPP_SOURCE_COMMIT: ${{ github.sha }}
          FPP_EVIDENCE_PATH: release-evidence/release-evidence.txt
        run: bash scripts/verify-release-apk.sh app/build/outputs/apk/release/app-release.apk

      - name: Upload private production candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: field-photo-prep-production-candidate-v42
          path: |
            app/build/outputs/apk/release/app-release.apk
            release-evidence/release-evidence.txt
          if-no-files-found: error
          retention-days: 14
