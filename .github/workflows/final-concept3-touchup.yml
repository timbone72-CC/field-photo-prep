name: Final Concept 3 Touchup

on:
  push:
    branches:
      - feat/concept-3-ui-makeover-20260912

permissions:
  contents: write

jobs:
  touchup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final visual touchups
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/inandout/fieldphotoprep/MainActivity.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('tintDriveStatusDot(R.color.home_primary);', 'tintDriveStatusDot(R.color.home_on_primary);')
          old = '''ViewCompat.setOnApplyWindowInsetsListener(legacyRoot, (view, insets) -> {\n        var bars = insets.getInsets(WindowInsetsCompat.Type.systemBars());\n        view.setPadding(0, bars.top, 0, bars.bottom);\n        return insets;\n    });'''
          new = '''ViewCompat.setOnApplyWindowInsetsListener(legacyRoot, (view, insets) -> {\n        var bars = insets.getInsets(WindowInsetsCompat.Type.systemBars());\n        view.setPadding(dp(14), bars.top, dp(14), bars.bottom);\n        return insets;\n    });'''
          if old not in text:
              raise SystemExit('Expected Work Orders inset block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit touchups
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/inandout/fieldphotoprep/MainActivity.java
          git commit -m "Finish Concept 3 visual touchups"
          git push origin HEAD:feat/concept-3-ui-makeover-20260912
