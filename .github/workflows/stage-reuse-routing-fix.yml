name: Stage Reuse Routing Correction

on:
  push:
    branches:
      - fix/reused-work-order-capture-sequence-reset-20260917

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reused-work-order-capture-sequence-reset-20260917
          fetch-depth: 0
      - run: python3 .github/scripts/stage_reuse_routing_fix.py
      - run: |
          git config user.name "timbone72-CC"
          git config user.email "timbone72@gmail.com"
          git add -A
          git commit -m "Route selected old work orders through reuse"
          git push origin HEAD:fix/reused-work-order-capture-sequence-reset-20260917
