plugins {
    id 'com.android.application'
}

def stableTestKeystore = rootProject.file('ci/field-photo-prep-test.jks')

android {
    namespace 'com.inandout.fieldphotoprep'
    compileSdk 36

    defaultConfig {
        applicationId 'com.inandout.fieldphotoprep'
        minSdk 26
        targetSdk 36
        versionCode 35
        versionName '0.27-auth-session-foundation'

        buildConfigField 'String', 'SUPABASE_URL', '"https://vtyiktvqhbgabawotkrj.supabase.co"'
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', '"sb_publishable_QXGedlj5wCmMpV2HncZp9A_kfgLzuAQ"'
        buildConfigField 'String', 'AUTH_REDIRECT_SCHEME', '"com.inandout.fieldphotoprep"'
        buildConfigField 'String', 'AUTH_REDIRECT_HOST', '"auth-callback"'
        manifestPlaceholders = [authRedirectScheme: 'com.inandout.fieldphotoprep']

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        stableTest {
            storeFile stableTestKeystore
            storePassword 'field-photo-prep-test'
            keyAlias 'field-photo-prep-test'
            keyPassword 'field-photo-prep-test'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.internal'
            versionNameSuffix '-internal'
            signingConfig signingConfigs.stableTest
            buildConfigField 'String', 'AUTH_REDIRECT_SCHEME', '"com.inandout.fieldphotoprep.internal"'
            manifestPlaceholders = [authRedirectScheme: 'com.inandout.fieldphotoprep.internal']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def camerax_version = '1.6.2'

    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
