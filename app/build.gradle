plugins {
    id 'com.android.application'
}

def productionApplicationId = 'com.inandout.fieldphotoprep'
def productionVersionCode = 41
def productionVersionName = '0.28.4'
def supabaseUrl = 'https://vtyiktvqhbgabawotkrj.supabase.co'
def supabasePublishableKey = 'sb_publishable_QXGedlj5wCmMpV2HncZp9A_kfgLzuAQ'
def productionAuthRedirectScheme = productionApplicationId
def productionAuthRedirectHost = 'auth-callback'
def stableTestKeystore = rootProject.file('ci/field-photo-prep-test.jks')

def requiredReleaseSigningEnvironment = [
        'FPP_RELEASE_STORE_FILE',
        'FPP_RELEASE_STORE_PASSWORD',
        'FPP_RELEASE_KEY_ALIAS',
        'FPP_RELEASE_KEY_PASSWORD',
        'FPP_RELEASE_CERT_SHA256'
]
def missingReleaseSigningEnvironment = requiredReleaseSigningEnvironment.findAll {
    def value = System.getenv(it)
    value == null || value.trim().isEmpty()
}
def hasReleaseSigningEnvironment = missingReleaseSigningEnvironment.isEmpty()

android {
    namespace 'com.inandout.fieldphotoprep'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId productionApplicationId
        minSdk 26
        targetSdk 36
        versionCode productionVersionCode
        versionName productionVersionName

        buildConfigField 'String', 'SUPABASE_URL', '"' + supabaseUrl + '"'
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY', '"' + supabasePublishableKey + '"'
        buildConfigField 'String', 'AUTH_REDIRECT_SCHEME', '"' + productionAuthRedirectScheme + '"'
        buildConfigField 'String', 'AUTH_REDIRECT_HOST', '"' + productionAuthRedirectHost + '"'
        manifestPlaceholders = [authRedirectScheme: productionAuthRedirectScheme]

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        stableTest {
            storeFile stableTestKeystore
            storePassword 'field-photo-prep-test'
            keyAlias 'field-photo-prep-test'
            keyPassword 'field-photo-prep-test'
        }

        if (hasReleaseSigningEnvironment) {
            productionRelease {
                storeFile file(System.getenv('FPP_RELEASE_STORE_FILE'))
                storePassword System.getenv('FPP_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('FPP_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('FPP_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.internal'
            versionNameSuffix '-internal'
            signingConfig signingConfigs.stableTest
            buildConfigField 'String', 'AUTH_REDIRECT_SCHEME', '"com.inandout.fieldphotoprep.internal"'
            manifestPlaceholders = [authRedirectScheme: 'com.inandout.fieldphotoprep.internal']
        }

        release {
            debuggable false
            minifyEnabled false
            if (hasReleaseSigningEnvironment) {
                signingConfig signingConfigs.productionRelease
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('verifyProductionReleaseIdentity') {
    group = 'verification'
    description = 'Verifies source-controlled production package/auth/Supabase release identity.'

    doLast {
        if (productionApplicationId != 'com.inandout.fieldphotoprep') {
            throw new GradleException('Production application ID changed unexpectedly.')
        }
        if (productionVersionCode <= 36) {
            throw new GradleException('Production versionCode must advance beyond governed baseline 36.')
        }
        if (productionAuthRedirectScheme != productionApplicationId
                || productionAuthRedirectHost != 'auth-callback') {
            throw new GradleException('Production auth callback identity is not the approved package://auth-callback value.')
        }
        if (supabaseUrl != 'https://vtyiktvqhbgabawotkrj.supabase.co') {
            throw new GradleException('Release points at an unexpected Supabase project URL.')
        }
        if (!supabasePublishableKey.startsWith('sb_publishable_')) {
            throw new GradleException('Android release must use a modern Supabase publishable key.')
        }
        def loweredKey = supabasePublishableKey.toLowerCase()
        if (loweredKey.contains('service_role') || loweredKey.startsWith('sb_secret_')) {
            throw new GradleException('Secret/service-role Supabase material must never be embedded in Android.')
        }
        println "Verified production identity: ${productionApplicationId} v${productionVersionCode} (${productionVersionName})"
        println "Verified production callback: ${productionAuthRedirectScheme}://${productionAuthRedirectHost}"
        println "Verified dedicated Supabase project URL with publishable client key."
    }
}

tasks.register('verifyProductionReleaseSigningInputs') {
    group = 'verification'
    description = 'Fails closed unless all external production signing inputs are present and structurally valid.'

    doLast {
        if (!missingReleaseSigningEnvironment.isEmpty()) {
            throw new GradleException(
                    'Missing required production signing environment: '
                            + missingReleaseSigningEnvironment.join(', '))
        }

        def signingFile = file(System.getenv('FPP_RELEASE_STORE_FILE'))
        if (!signingFile.isFile()) {
            throw new GradleException('FPP_RELEASE_STORE_FILE does not point to a readable keystore file.')
        }

        def fingerprint = System.getenv('FPP_RELEASE_CERT_SHA256')
                .replace(':', '')
                .trim()
                .toLowerCase()
        if (!(fingerprint ==~ /[0-9a-f]{64}/)) {
            throw new GradleException(
                    'FPP_RELEASE_CERT_SHA256 must be exactly one SHA-256 certificate fingerprint.')
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') {
        task.dependsOn(tasks.named('verifyProductionReleaseIdentity'))
        task.dependsOn(tasks.named('verifyProductionReleaseSigningInputs'))
    }
}

dependencies {
    def camerax_version = '1.6.2'

    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.1'
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
